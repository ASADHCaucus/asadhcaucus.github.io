<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Content Manager</title>
    <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      if (["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname)) {
        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js";
        script.onerror = () => {
          document.body.textContent =
            "Unable to load the editor. Check your internet connection and reload.";
        };
        document.body.appendChild(script);
      } else {
        document.body.textContent =
          "This editor is local-only. Clone the repository and run npm run dev:cms, then open http://localhost:3000/admin/index.html.";
      }
    </script>
    <noscript>Enable JavaScript to use the content editor.</noscript>
  </body>
</html>
